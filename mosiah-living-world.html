<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>The Living Lands of Mosiah</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{background:#0c0e15;color:#e9e5d9;font-family:'Hanken Grotesk',system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;height:100vh;height:100dvh;}
#topbar{display:flex;align-items:center;gap:10px;padding:10px 13px;border-bottom:1px solid #2b3043;
  background:linear-gradient(180deg,#13151f,#0e1018);z-index:30;flex:none;overflow-x:auto;}
#brand{display:flex;flex-direction:column;line-height:1.05;flex:none;margin-right:4px;}
#brand .t{font-family:'Cinzel',serif;font-weight:700;font-size:16px;color:#f3efe2;letter-spacing:.02em;white-space:nowrap;}
#brand .s{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:#c9a227;}
.chip{font-family:inherit;font-size:12px;font-weight:600;color:#9a9caa;cursor:pointer;background:#181b27;
  border:1px solid #2b3043;border-radius:999px;padding:7px 11px;white-space:nowrap;flex:none;
  transition:color .15s,border-color .15s,background .15s;}
.chip:hover{color:#e9e5d9;border-color:#3a4058;}
.chip.on{color:#1a1505;background:#c9a227;border-color:#c9a227;}
#stage{flex:1;position:relative;min-height:0;overflow:hidden;}
#scene{width:100%;height:100%;display:block;touch-action:none;cursor:grab;}
#scene.grab{cursor:grabbing;}
.float{position:absolute;z-index:20;}
#zoomctl{right:11px;top:11px;display:flex;flex-direction:column;gap:6px;}
#zoomctl button{width:38px;height:38px;border-radius:10px;border:1px solid #2b3043;background:rgba(20,23,33,.82);
  color:#e9e5d9;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(4px);}
#zoomctl button:hover{background:rgba(31,35,51,.95);}
#zoomctl svg{width:17px;height:17px;}
#hint{left:11px;top:11px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#8a8ea2;
  background:rgba(16,18,25,.6);border:1px solid #2b3043;border-radius:8px;padding:6px 9px;backdrop-filter:blur(3px);
  pointer-events:none;max-width:60%;}
#dock{flex:none;border-top:1px solid #2b3043;background:linear-gradient(180deg,#15182230,#0f111a);z-index:30;
  padding:10px 13px calc(10px + env(safe-area-inset-bottom));}
#transport{display:flex;align-items:center;gap:9px;}
.tc{width:40px;height:40px;border-radius:50%;border:1px solid #2b3043;background:#1f2333;color:#e9e5d9;
  cursor:pointer;display:grid;place-items:center;flex:none;}
.tc:hover{background:#262b3d;}
#playBtn{background:linear-gradient(180deg,#caa531,#a9851d);border-color:#caa531;color:#1a1505;width:46px;height:46px;}
.tc svg{width:17px;height:17px;}
#scenebox{flex:1;min-width:0;}
#sceneTitle{font-size:15px;font-weight:700;color:#f1ede1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#sceneMeta{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#c9a227;margin-top:2px;letter-spacing:.02em;}
#scrubber{display:flex;gap:3px;margin-top:10px;}
#scrubber .tick{flex:1;height:5px;border-radius:3px;background:#262b3d;cursor:pointer;transition:background .2s;}
#scrubber .tick.past{background:#4a5169;}#scrubber .tick.now{background:#c9a227;}
#content{margin-top:10px;font-size:13px;line-height:1.5;color:#cbc8bd;min-height:34px;}
#content .cap{display:flex;gap:8px;align-items:flex-start;}
#content .cap .pin{flex:none;margin-top:1px;}
.lm{background:#181b27;border:1px solid #2b3043;border-left:3px solid #c9a227;border-radius:11px;padding:11px 12px;position:relative;}
.lm .x{position:absolute;right:8px;top:6px;background:none;border:0;color:#9a9caa;font-size:16px;cursor:pointer;}
.lm .k{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:#c9a227;}
.lm .n{font-family:'Cinzel',serif;font-size:16px;color:#f3efe2;margin:2px 0 4px;}
.lm .i{font-size:12.5px;color:#c7c4ba;line-height:1.5;}
#walkBtn{position:absolute;right:12px;bottom:12px;z-index:21;display:flex;align-items:center;gap:7px;font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12.5px;color:#1a1505;background:linear-gradient(180deg,#d8b340,#b48f22);border:1px solid #e2c052;border-radius:999px;padding:9px 14px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35);}
#walkBtn svg{width:16px;height:16px;}
#walkBtn:hover{filter:brightness(1.06);}
#walkUI{position:absolute;inset:0;z-index:30;display:none;}
#walkUI.on{display:block;}
#stage.walking #zoomctl,#stage.walking #hint{display:none;}
#lookPad{position:absolute;right:0;top:0;width:60%;height:100%;touch-action:none;cursor:grab;}
#joy{position:absolute;left:20px;bottom:24px;width:116px;height:116px;border-radius:50%;background:rgba(14,16,24,.4);border:1px solid rgba(201,162,39,.5);touch-action:none;}
#joyKnob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:radial-gradient(circle at 36% 30%,#e7c64a,#a9851d);border:1px solid #ecd06a;box-shadow:0 2px 8px rgba(0,0,0,.4);}
#exitWalk{position:absolute;left:14px;top:14px;display:flex;align-items:center;gap:6px;font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;color:#e9e5d9;background:rgba(14,16,24,.72);border:1px solid #2b3043;border-radius:9px;padding:8px 12px;cursor:pointer;}
#exitWalk svg{width:15px;height:15px;}
#viewToggle{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:11px;letter-spacing:.04em;color:#e9e5d9;background:rgba(14,16,24,.72);border:1px solid #2b3043;border-radius:9px;padding:8px 11px;cursor:pointer;}
#walkHint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#cfccc1;background:rgba(14,16,24,.5);border:1px solid #2b3043;border-radius:8px;padding:6px 11px;white-space:nowrap;pointer-events:none;}
#walkHint b{color:#f0c843;}
#talkPrompt{position:absolute;left:50%;bottom:54px;transform:translateX(-50%);display:none;align-items:center;gap:7px;font-family:'Hanken Grotesk',sans-serif;font-size:13px;color:#f3efe2;background:rgba(20,18,12,.88);border:1px solid #b9912b;border-radius:20px;padding:9px 16px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4);white-space:nowrap;}
#talkPrompt b{color:#f0c843;font-weight:700;}
#talkPrompt .k{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;color:#1a1206;background:#f0c843;border-radius:4px;padding:1px 6px;}
#talkBox{position:absolute;left:50%;bottom:22px;transform:translateX(-50%) translateY(12px);width:min(560px,92vw);background:rgba(16,15,22,.95);border:1px solid #3a3550;border-radius:14px;padding:15px 17px 14px;opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;box-shadow:0 10px 34px rgba(0,0,0,.5);box-sizing:border-box;}
#talkBox.on{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0);}
#talkName{font-family:'Cinzel',serif;font-weight:700;font-size:16px;color:#f0e3c0;margin-bottom:5px;}
#talkName .role{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:#caa23a;margin-left:7px;}
#talkText{font-family:'Hanken Grotesk',sans-serif;font-size:14px;line-height:1.5;color:#e7e2d6;margin-bottom:12px;}
#talkText i{color:#b9b39f;}
#talkText .purse{display:inline-block;margin-left:6px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#7fd0a0;}
#talkOpts{display:flex;flex-direction:column;gap:7px;}
#talkOpts button{text-align:left;font-family:'Hanken Grotesk',sans-serif;font-size:13px;color:#ece7db;background:rgba(40,38,54,.7);border:1px solid #43405c;border-radius:9px;padding:9px 12px;cursor:pointer;transition:background .12s,border-color .12s;}
#talkOpts button:hover{background:rgba(58,54,78,.92);border-color:#c9a227;}
#talkOpts button .price{float:right;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#f0c843;font-weight:600;}
#talkOpts button.leave{color:#cfccc1;background:transparent;border-color:#34324a;text-align:center;margin-top:2px;}
</style>
</head>
<body>
<div id="topbar">
  <div id="brand"><span class="t">The Living Lands of Mosiah</span><span class="s">walkable world</span></div>
  <button class="chip" data-go="nephi">Lehi-Nephi</button>
  <button class="chip" data-go="mormon">Waters of Mormon</button>
  <button class="chip" data-go="helam">Helam</button>
  <button class="chip" data-go="zarahemla">Zarahemla</button>
</div>

<div id="stage">
  <canvas id="scene"></canvas>
  <div class="float" id="hint">Drag to roam &middot; pinch/scroll to zoom &middot; tap a landmark</div>
  <div class="float" id="zoomctl">
    <button id="zin" aria-label="in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button id="zout" aria-label="out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
    <button id="zfit" aria-label="recenter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4"/></svg></button>
  </div>
  <button id="walkBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 4a1.6 1.6 0 1 0 0-.01M9 20l2-5 1.5-2M11 9l3 1 2 3M11 9l-2 2-3 1M14 14l1 6"/></svg>Walk here</button>
  <div id="walkUI">
    <div id="lookPad"></div>
    <button id="exitWalk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Exit walk</button>
    <button id="viewToggle">View: 3rd</button>
    <div id="walkHint">WASD / arrows or joystick to move &middot; drag to look &middot; <b>E</b> to talk</div>
    <button id="talkPrompt"></button>
    <div id="talkBox"><div id="talkName"></div><div id="talkText"></div><div id="talkOpts"></div></div>
    <div id="joy"><div id="joyKnob"></div></div>
  </div>
</div>

<div id="dock">
  <div id="transport">
    <button class="tc" id="prevBtn" aria-label="prev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button class="tc" id="playBtn" aria-label="play"><svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
    <button class="tc" id="nextBtn" aria-label="next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
    <div id="scenebox"><div id="sceneTitle">&mdash;</div><div id="sceneMeta">&mdash;</div></div>
  </div>
  <div id="scrubber"></div>
  <div id="content"></div>
</div>

<script>
"use strict";
/* ===================== UTIL ===================== */
var TW=64, TH=32;
function iso(c,r){ return { x:(c-r)*(TW/2), y:(c+r)*(TH/2) }; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function lerp(a,b,t){ return a+(b-a)*t; }
function hx(h){ h=(h+"").replace('#',''); if(h.length<6) return [128,128,128]; return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]; }
function shade(hex,f){ var c=hx(hex); function g(x){return clamp(Math.round(f<0? x*(1+f) : x+(255-x)*f),0,255);} return 'rgb('+g(c[0])+','+g(c[1])+','+g(c[2])+')'; }
function mkRng(seed){ var s=(seed||1)>>>0; return function(){ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
function now(){ return performance.now(); }

/* ===================== CANVAS / CAMERA ===================== */
var canvas=document.getElementById("scene"), ctx=canvas.getContext("2d");
var DPR=Math.min(window.devicePixelRatio||1, 2);
var Wc=0, Hc=0;
function resize(){ var st=document.getElementById("stage"); Wc=st.clientWidth; Hc=st.clientHeight;
  canvas.width=Math.round(Wc*DPR); canvas.height=Math.round(Hc*DPR); canvas.style.width=Wc+"px"; canvas.style.height=Hc+"px"; }
window.addEventListener("resize",function(){ resize(); });
var cam={x:0,y:0,zoom:1, tx:0,ty:0,tz:1, anim:false,t0:0,sx:0,sy:0,sz:1};
function focusWorld(wx,wy,zoom,animate){ var z=clamp(zoom,0.5,2.6); var nx=Wc/2 - wx*z, ny=Hc/2 - wy*z;
  if(animate){ cam.tx=nx; cam.ty=ny; cam.tz=z; cam.anim=true; cam.t0=now(); cam.sx=cam.x; cam.sy=cam.y; cam.sz=cam.zoom; }
  else { cam.x=nx; cam.y=ny; cam.zoom=z; cam.anim=false; } }
function zoomAround(sx,sy,factor){ var nz=clamp(cam.zoom*factor,0.5,2.8); var k=nz/cam.zoom;
  cam.x = sx-(sx-cam.x)*k; cam.y = sy-(sy-cam.y)*k; cam.zoom=nz; cam.anim=false; }
function w2s(p){ return { x:p.x*cam.zoom+cam.x, y:p.y*cam.zoom+cam.y }; }

/* ===================== INPUT ===================== */
var pointers={}, panLast=null, pinch=0, didPan=false, downXY=null;
function rel(e){ var b=canvas.getBoundingClientRect(); return {x:e.clientX-b.left, y:e.clientY-b.top}; }
canvas.addEventListener("pointerdown",function(e){ if(WALK.active) return; canvas.setPointerCapture(e.pointerId); var p=rel(e); pointers[e.pointerId]=p;
  var n=Object.keys(pointers).length; didPan=false; downXY=p; cam.anim=false;
  if(n===1){ panLast=p; canvas.classList.add("grab"); } else if(n===2){ var a=Object.values(pointers); pinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y); panLast=null; } });
canvas.addEventListener("pointermove",function(e){ if(WALK.active) return; if(!pointers[e.pointerId]) return; var p=rel(e); pointers[e.pointerId]=p;
  var a=Object.values(pointers), n=a.length;
  if(n===1 && panLast){ cam.x+=p.x-panLast.x; cam.y+=p.y-panLast.y; panLast=p; if(downXY && Math.hypot(p.x-downXY.x,p.y-downXY.y)>6) didPan=true; }
  else if(n===2){ var d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y); var mx=(a[0].x+a[1].x)/2,my=(a[0].y+a[1].y)/2; if(pinch>0) zoomAround(mx,my,d/pinch); pinch=d; didPan=true; } });
function up(e){ if(pointers[e.pointerId]) delete pointers[e.pointerId]; var a=Object.values(pointers);
  if(a.length===0){canvas.classList.remove("grab");panLast=null;pinch=0;} else if(a.length===1){panLast=a[0];pinch=0;} }
canvas.addEventListener("pointerup",up); canvas.addEventListener("pointercancel",up);
canvas.addEventListener("wheel",function(e){ if(WALK.active) return; e.preventDefault(); var p=rel(e); zoomAround(p.x,p.y, e.deltaY<0?1.12:1/1.12); },{passive:false});
canvas.addEventListener("click",function(e){ if(WALK.active) return; if(didPan){ didPan=false; return; } var p=rel(e);
  var wx=(p.x-cam.x)/cam.zoom, wy=(p.y-cam.y)/cam.zoom; var best=null,bd=9999;
  (world.landmarks||[]).forEach(function(L){ var d=Math.hypot(wx-L.ax,wy-L.ay); if(d<bd){bd=d;best=L;} });
  if(best && bd<46){ showLandmark(best); } });

/* ===================== PALETTES (base per place) ===================== */
var PAL={
  nephi:{ tiles:{grass:"#6c7f4c",dirt:"#9c7f55",road:"#a7adba",water:"#2f6f6a",field:"#9a8350",plaza:"#b2b6c0"},
    bldg:{top:"#d8cba8",left:"#bcae8a",right:"#998b6c"}, roof:["#bd6b3e","#8f4f30"] },
  zarahemla:{ tiles:{grass:"#5f7d44",dirt:"#9a7d4f",road:"#b0b3a6",water:"#2f6f6a",field:"#94854a",plaza:"#c2c4b6"},
    bldg:{top:"#e6dab6",left:"#cabb93",right:"#a89a7c"}, roof:["#c89a4a","#9a6f2c"] },
  mormon:{ tiles:{grass:"#4f6e3e",dirt:"#7d6a44",road:"#8f9488",water:"#246a64",field:"#7d6a44",plaza:"#9aa093"},
    bldg:{top:"#cfc6a6",left:"#b0a684",right:"#8e856a"}, roof:["#9a6f3a","#7c592c"] },
  helam:{ tiles:{grass:"#69804a",dirt:"#9a7f52",road:"#a3a8b2",water:"#2f6f6a",field:"#9c8a50",plaza:"#b0b4be"},
    bldg:{top:"#d4c8a6",left:"#b6a884",right:"#928568"}, roof:["#b07a44","#8c5f30"] }
};

/* ===================== MOODS (per scene time-of-day) ===================== */
/* sun:[color,xFrac,yFrac,intensity]  tint=full-screen wash recolouring the world */
var MOODS={
  golden:{ sky:["#3a3650","#eab667"], sun:["#ffe2a0",0.68,0.74,0.55], tint:"rgba(255,176,84,0.17)", hill:"#5b4a52" },
  day:{    sky:["#2c3a5a","#a6b8cd"], sun:["#f4e6bd",0.74,0.18,0.45], tint:"rgba(255,250,235,0.04)", hill:"#46506e" },
  harsh:{  sky:["#3b486a","#cbd2de"], sun:["#fbf4dc",0.6,0.14,0.5],  tint:"rgba(255,245,210,0.06)", hill:"#4a546e" },
  dusk:{   sky:["#241a33","#c06a48"], sun:["#f6a256",0.72,0.66,0.5], tint:"rgba(150,64,70,0.22)", hill:"#3a2738" },
  ashen:{  sky:["#3a404e","#8c9198"], sun:["#cfd3da",0.55,0.18,0.22],tint:"rgba(96,104,114,0.30)", hill:"#444a54" },
  dawn:{   sky:["#283150","#dcc28c"], sun:["#ffe9b4",0.30,0.30,0.42], tint:"rgba(196,172,120,0.15)", mist:true, hill:"#3c4a55" },
  storm:{  sky:["#171a24","#474c5b"], sun:["#6a6f7e",0.5,0.14,0.18],  tint:"rgba(16,18,32,0.44)", storm:true, hill:"#23262f" },
  night:{  sky:["#0d1226","#2b3654"], sun:["#cfd8ff",0.80,0.16,0.22], tint:"rgba(22,32,72,0.46)", night:true, hill:"#161b2d" },
  radiant:{sky:["#1d2542","#d3c2e4"], sun:["#fff7da",0.5,0.14,0.85],  tint:"rgba(255,250,224,0.08)", rays:true, hill:"#3a3a56" }
};
var STAGE={ mood:MOODS.day, embers:false, lightning:0, dim:0, beam:false, heroBoost:1.05, shot:"establish" };

/* ===================== WORLD ===================== */
var world={ grid:[], n:0, ents:[], actors:[], walk:[], landmarks:[], pal:PAL.nephi, place:"nephi", focus:{tile:[8,8]}, tower:null, primaryHero:null, _pool:null };

function tileOpen(g,c,r){ if(c<0||r<0||c>=g.n||r>=g.n) return false; var t=g.grid[r][c]; return (t==="grass"||t==="dirt"||t==="road"||t==="field"||t==="plaza"); }
function markOcc(occ,c,r,w,d){ for(var i=0;i<w;i++)for(var j=0;j<d;j++){ var cc=c+i,rr=r+j; if(occ[rr]) occ[rr][cc]=true; } }
function makeActor(c,r,kind,rng,g,gather){ return { c:c,r:r, tc:c,tr:r, kind:kind, sp:0.5+rng()*0.5, phase:rng()*6.28, face:1,
  idle:false, pose:"walk", scale:1, gather:gather||null, wait:0, rng:rng, g:g }; }
function staticActor(W,c,r,kind,scale){ var a=makeActor(c,r,kind,mkRng(Math.floor(c*7+r*13)+5),W); a.idle=true; a.scale=scale||1; return a; }
function addCitizens(W,occ,count,rng,gather,clump){
  var open=[]; for(var r=0;r<W.n;r++)for(var c=0;c<W.n;c++){ if(tileOpen(W,c,r) && !(occ[r]&&occ[r][c])) open.push([c,r]); }
  if(!open.length) return;
  for(var i=0;i<count;i++){ var pt;
    if(gather && rng()<(clump||0)){ pt=[ clamp(Math.round(gather[0]+(rng()*8-4)),1,W.n-2), clamp(Math.round(gather[1]+(rng()*8-4)),1,W.n-2) ]; if(!tileOpen(W,pt[0],pt[1])) pt=open[Math.floor(rng()*open.length)]; }
    else pt=open[Math.floor(rng()*open.length)];
    W.actors.push(makeActor(pt[0]+0.5,pt[1]+0.5,"citizen",rng,W,gather)); }
}

/* --- City generator (Nephi / Zarahemla) --- */
function genCity(place,opts){
  var pal=PAL[place]; var rng=mkRng(opts.seed||7); var style=opts.style||place;
  var n=opts.n||22; var grid=[]; for(var r=0;r<n;r++){ grid[r]=[]; for(var c=0;c<n;c++) grid[r][c]="grass"; }
  var occ=[]; for(var r2=0;r2<n;r2++){occ[r2]=[];}
  var bx0=3,by0=3,bx1=n-4,by1=n-4;
  for(var r3=by0;r3<=by1;r3++)for(var c3=bx0;c3<=bx1;c3++) grid[r3][c3]="dirt";
  var rMid=Math.floor((by0+by1)/2), cMid=Math.floor((bx0+bx1)/2);
  for(var c4=bx0;c4<=bx1;c4++) grid[rMid][c4]="road";
  for(var r4=by0;r4<=by1;r4++) grid[r4][cMid]="road";
  if(style==="zarahemla"){ for(var pr=rMid-1;pr<=rMid+1;pr++)for(var pc=cMid-1;pc<=cMid+1;pc++) grid[pr][pc]="plaza"; }
  var W={ grid:grid, n:n, ents:[], actors:[], walk:[], landmarks:[], pal:pal, place:place, focus:{tile:[cMid,rMid]}, tower:null, primaryHero:null };

  if(opts.walls){
    for(var c5=bx0-1;c5<=bx1+1;c5++){ pushWall(W,occ,c5,by0-1); pushWall(W,occ,c5,by1+1); }
    for(var r5=by0;r5<=by1;r5++){ pushWall(W,occ,bx0-1,r5); pushWall(W,occ,bx1+1,r5); }
    var gateR=by1+1; var gi=W.ents.findIndex(function(e){return e.type==="wall"&&e.c===cMid&&e.r===gateR;}); if(gi>=0) W.ents.splice(gi,1);
    W.ents.push({type:"gate",c:cMid,r:gateR,w:1,d:1}); markOcc(occ,cMid,gateR,1,1); W.gate=[cMid,gateR];
    W.landmarks.push(landmark("gate","City gate","Entrance",cMid,gateR,1,1,24,"The road south runs from this gate across the narrow strip of wilderness toward distant Zarahemla."));
  } else { W.gate=[cMid,by1+1]; }
  var tcx=cMid-1, tcy=by0+1; pushTemple(W,occ,tcx,tcy);
  W.landmarks.push(landmark("temple", place==="zarahemla"?"The Temple of Zarahemla":"Temple of Nephi","Sacred house",tcx,tcy,3,2,52, place==="zarahemla"?"From a tower beside this temple King Benjamin gathered the people for his covenant sermon.":"The temple the colony built in the land of Nephi."));
  W.temple=[tcx,tcy];
  var twx=cMid+2, twy=by0+1; var anchor=pushTower(W,occ,twx,twy, opts.towerH||84, style);
  W.tower={x:twx,y:twy,anchor:anchor};
  W.landmarks.push(landmark("tower", place==="zarahemla"?"Benjamin's Tower":"King Noah's Tower","Royal tower",twx,twy,1,1,opts.towerH||84, place==="zarahemla"?"The tower King Benjamin built so the whole multitude could hear his words.":"The lofty tower King Noah built, overlaid with fine wood and ornament."));
  pushHouse(W,occ,bx0+1,by1-2,2,2,pal.roof[0],true);
  for(var s=0;s<4;s++){ var sc=cMid-2+s; var srr=rMid+2; if(tileOpen(W,sc,srr)&&!(occ[srr]&&occ[srr][sc])){ W.ents.push({type:"stall",c:sc,r:srr,w:1,d:1,color:["#b5603a","#3a6f8f","#8f7a3a","#6f8f5a"][s%4]}); markOcc(occ,sc,srr,1,1);} }
  if(tileOpen(W,cMid+1,rMid+3)&&!(occ[rMid+3]&&occ[rMid+3][cMid+1])){ W.ents.push({type:"well",c:cMid+1,r:rMid+3,w:1,d:1}); markOcc(occ,cMid+1,rMid+3,1,1); }
  W.ents.push({type:"banner",c:tcx-1,r:tcy+2,w:1,d:1,color:style==="zarahemla"?"#6ea0e0":"#c9a227"});
  W.ents.push({type:"torch",c:twx,r:twy+2,w:1,d:1}); W.ents.push({type:"torch",c:twx-2,r:twy+2,w:1,d:1});
  var roofMain = style==="zarahemla"? 0:1;
  for(var ph=by0;ph<=by1-1;ph+=2){ for(var pw2=bx0;pw2<=bx1-1;pw2+=2){
    if((occ[ph]&&occ[ph][pw2])||grid[ph][pw2]==="road"||grid[ph][pw2]==="plaza") continue;
    if(Math.abs(pw2-cMid)<=1 || Math.abs(ph-rMid)<=1) continue; // keep the main streets clear
    if(rng()<0.52){ pushHouse(W,occ,pw2,ph,1,1, pal.roof[rng()<0.62?roofMain:1-roofMain], false); } } }
  addMerchants(W,occ,place,cMid,rMid);
  scatterProps(W,occ,rng,place);
  if(style==="zarahemla"){ scatterInside(W,occ,rng,4); scatterNature(W,occ,rng,22,4); }
  else { scatterNature(W,occ,rng,26,6); }
  return W;
}
function addMerchants(W,occ,place,cMid,rMid){
  var wares = place==="zarahemla"
    ? [{n:"fine linen",p:2},{n:"a measure of grain",p:1},{n:"a jar of honey",p:2},{n:"a copper bowl",p:2},{n:"salted fish",p:1},{n:"a gold ring",p:3}]
    : [{n:"a measure of barley",p:1},{n:"dried figs",p:1},{n:"woven cloth",p:2},{n:"a clay jar",p:1},{n:"a flask of olive oil",p:2},{n:"a bronze knife",p:3}];
  var spots=[[cMid-3,rMid+1],[cMid+2,rMid+1],[cMid-1,rMid+2]], names=["Market Trader","Cloth Merchant","Grain Seller"];
  for(var i=0;i<2;i++){ var s=spots[i]; if(!s) break; var c=s[0],r=s[1]; if(c<1||r<1||c>=W.n-1||r>=W.n-1) continue; if(!tileOpen(W,c,r)||(occ[r]&&occ[r][c])) continue;
    var a=makeActor(c+0.5,r+0.5,"citizen",mkRng(900+i*31+(place==="zarahemla"?7:0)),W); a.idle=true; a.pose="trade"; a.merchant=true; a.name=names[i]; a.sub="Trader"; a.wares=wares; a.face=1; W.actors.push(a); } }
function scatterProps(W,occ,rng,place){
  function tryPlace(type,extra,onGrass){ for(var t=0;t<40;t++){ var c=2+Math.floor(rng()*(W.n-4)), r=2+Math.floor(rng()*(W.n-4)); var g=W.grid[r]&&W.grid[r][c];
    var ok=onGrass?(g==="grass"):(g==="dirt"); if(ok && !(occ[r]&&occ[r][c])){ var e={type:type,c:c,r:r,w:1,d:1}; if(extra) for(var k in extra) e[k]=extra[k]; W.ents.push(e); if(type==="crate"||type==="cart") markOcc(occ,c,r,1,1); return true; } } return false; }
  for(var i=0;i<5;i++) tryPlace("bush",{v:rng()});
  for(var i=0;i<6;i++) tryPlace("flowers",{col:["#d98fb0","#e0c24a","#cf6a5a","#b58fd0"][Math.floor(rng()*4)]});
  for(var i=0;i<3;i++) tryPlace("crate",{});
  for(var i=0;i<3;i++) tryPlace("pot",{});
  for(var i=0;i<2;i++) tryPlace("sheep",{}, place==="helam");
  if(W.gate){ var gc=W.gate[0]-2, gr=W.gate[1]-1; if(gc>1&&gr>1&&W.grid[gr]&&tileOpen(W,gc,gr)&&!(occ[gr]&&occ[gr][gc])){ W.ents.push({type:"cart",c:gc,r:gr,w:1,d:1}); markOcc(occ,gc,gr,1,1); } }
  for(var i=0;i<10;i++) tryPlace("bush",{v:rng()},true);
}
function scatterInside(W,occ,rng,trees){ var t=0,tries=0; while(t<trees&&tries<200){tries++; var c=3+Math.floor(rng()*(W.n-6)), r=3+Math.floor(rng()*(W.n-6));
  if((W.grid[r][c]==="dirt")&&!(occ[r]&&occ[r][c])){ W.ents.push({type:"tree",c:c,r:r,w:1,d:1,v:rng()}); markOcc(occ,c,r,1,1); t++; } } }
function pushWall(W,occ,c,r){ if(c<0||r<0||c>=W.n||r>=W.n) return; W.ents.push({type:"wall",c:c,r:r,w:1,d:1}); markOcc(occ,c,r,1,1); }
function pushHouse(W,occ,c,r,w,d,roof,big){ W.ents.push({type:"house",c:c,r:r,w:w,d:d,roof:roof,h:big?30:22,big:!!big}); markOcc(occ,c,r,w,d); }
function pushTemple(W,occ,c,r){ W.ents.push({type:"temple",c:c,r:r,w:3,d:2,h:40}); markOcc(occ,c,r,3,2); }
function pushTower(W,occ,c,r,H,style){ W.ents.push({type:"tower",c:c,r:r,w:1,d:1,h:H,style:style}); markOcc(occ,c,r,1,1); var p=iso(c+0.5,r+0.5); return {x:p.x, y:p.y-H-12}; }
function scatterNature(W,occ,rng,trees,rocks){ var tries=0;
  while(trees>0 && tries<500){ tries++; var c=Math.floor(rng()*W.n), r=Math.floor(rng()*W.n);
    if(W.grid[r][c]==="grass" && !(occ[r]&&occ[r][c])){ W.ents.push({type:"tree",c:c,r:r,w:1,d:1,v:rng()}); markOcc(occ,c,r,1,1); trees--; } }
  tries=0; while(rocks>0 && tries<200){ tries++; var c2=Math.floor(rng()*W.n), r2=Math.floor(rng()*W.n);
    if(W.grid[r2][c2]==="grass" && !(occ[r2]&&occ[r2][c2])){ W.ents.push({type:"rock",c:c2,r:r2,w:1,d:1}); markOcc(occ,c2,r2,1,1); rocks--; } } }
function landmark(id,name,kind,c,r,w,d,h,info){ var p=iso(c+w/2,r+d/2); return {id:id,name:name,kind:kind,info:info,ax:p.x,ay:p.y-h*0.6}; }

/* --- Wilderness (Waters of Mormon) --- */
function genWilderness(opts){
  var pal=PAL.mormon; var rng=mkRng(opts.seed||21); var n=20; var grid=[]; var occ=[];
  for(var r=0;r<n;r++){ grid[r]=[]; occ[r]=[]; for(var c=0;c<n;c++) grid[r][c]="grass"; }
  var W={ grid:grid, n:n, ents:[], actors:[], walk:[], landmarks:[], pal:pal, place:"mormon", focus:{tile:[10,10]}, tower:null, primaryHero:null };
  var px=8,py=9;
  for(var i=0;i<4;i++)for(var j=0;j<3;j++){ var cc=px+i,rr=py+j; if(rng()>0.12){ grid[rr][cc]="water"; markOcc(occ,cc,rr,1,1);} }
  W.landmarks.push({id:"waters",name:"Waters of Mormon",kind:"Wilderness fountain",info:"A fountain of pure water in the forest. Here Alma baptized about 450 believers and organized the church in secret.",ax:iso(px+2,py+1.5).x, ay:iso(px+2,py+1.5).y-12});
  var tries=0,trees=46; while(trees>0 && tries<700){ tries++; var c=Math.floor(rng()*n), r=Math.floor(rng()*n);
    var nearPool=(c>=px-1&&c<=px+4&&r>=py-1&&r<=py+3);
    if(grid[r][c]==="grass" && !(occ[r]&&occ[r][c]) && !nearPool){ W.ents.push({type:"tree",c:c,r:r,w:1,d:1,v:rng()}); markOcc(occ,c,r,1,1); trees--; } }
  W.ents.push({type:"tent",c:px-3,r:py+1,w:1,d:1,color:"#9a6f3a"}); markOcc(occ,px-3,py+1,1,1);
  W.ents.push({type:"tent",c:px-3,r:py+3,w:1,d:1,color:"#7c592c"}); markOcc(occ,px-3,py+3,1,1);
  W.ents.push({type:"fire",c:px-2,r:py+2,w:1,d:1}); markOcc(occ,px-2,py+2,1,1);
  W.focus={ tile:[px+1,py+1] }; W._pool=[px+1.6,py+1.4];
  return W;
}
/* --- Settlement (Helam) --- */
function genSettlement(opts){
  var pal=PAL.helam; var rng=mkRng(opts.seed||33); var n=20; var grid=[]; var occ=[];
  for(var r=0;r<n;r++){ grid[r]=[]; occ[r]=[]; for(var c=0;c<n;c++) grid[r][c]="grass"; }
  var W={ grid:grid, n:n, ents:[], actors:[], walk:[], landmarks:[], pal:pal, place:"helam", focus:{tile:[9,9]}, tower:null, primaryHero:null };
  for(var r2=12;r2<17;r2++)for(var c2=4;c2<10;c2++){ grid[r2][c2]="field"; }
  var rMid=9; for(var c3=3;c3<n-3;c3++) grid[rMid][c3]="road";
  var plots=[[7,5],[9,4],[11,6],[6,7],[12,8],[8,11],[13,11]];
  plots.forEach(function(p,i){ pushHouse(W,occ,p[0],p[1],1,1, pal.roof[i%2], i===0); });
  W.landmarks.push(landmark("meeting","Heart of Helam","Refuge",7,5,1,1,30,"Helam, founded by Alma's church eight days into the wilderness — a place of peace before Amulon's people arrived."));
  W.ents.push({type:"well",c:9,r:8,w:1,d:1}); markOcc(occ,9,8,1,1);
  scatterNature(W,occ,rng,16,4);
  scatterProps(W,occ,rng,"helam");
  W.focus={ tile:[9,9] }; W.gate=[16,9];
  return W;
}

function heroWorld(a){ return a.fixed? a.fixed : iso(a.c,a.r); }
function addHero(W,o){ var a=makeActor(o.c||0,o.r||0,o.kind,mkRng(o.seed||1),W);
  a.hero=true; a.name=o.name; a.sub=o.sub; a.pose=o.pose||"stand"; a.scale=o.scale||(o.kind==="angel"?1.8:1.55);
  if(o.fixed){ a.fixed=o.fixed; a.idle=true; } else { a.c=o.c; a.r=o.r; a.tc=(o.tc!=null?o.tc:o.c); a.tr=(o.tr!=null?o.tr:o.r); a.idle=!o.move; }
  if(o.primary!==false) W.primaryHero=a; W.actors.push(a); return a; }
function setCrowd(W,opt){ W.actors.forEach(function(a){ if(a.kind!=="citizen"||a.hero) return;
  if(opt.pose){ a.pose=opt.pose; a.idle=true; a._directed=true; } if(opt.slow) a.sp*=opt.slow;
  if(opt.gather){ a.gather=opt.gather; a.tc=clamp(Math.round(opt.gather[0]+(a.rng()*7-3.5)),1,W.n-2); a.tr=clamp(Math.round(opt.gather[1]+(a.rng()*7-3.5)),1,W.n-2); a._directed=true; if(opt.face) a.idle=true; }
  if(opt.toGate && W.gate){ a.tc=W.gate[0]+(a.rng()*2-1); a.tr=clamp(W.gate[1]-a.rng()*5,1,W.n-2); a.sp=0.75+a.rng()*0.3; a.gather=null; a.idle=false; a.pose="walk"; a._directed=true; } }); }
function gatherExtra(W,tile,extra,seed){ var rng=mkRng(seed||77); for(var i=0;i<extra;i++){ var c=clamp(Math.round(tile[0]+(rng()*8-4)),1,W.n-2), r=clamp(Math.round(tile[1]+(rng()*8-4)),1,W.n-2);
  if(tileOpen(W,c,r)){ var a=makeActor(c+0.5,r+0.5,"citizen",rng,W,tile); a.idle=true; a._directed=true; W.actors.push(a); } } }
function faceTo(a,t){ if(!t) return; var d=iso(t[0],t[1]).x - iso(a.c,a.r).x; a.face=(d<0)?-1:1; }
var POSE_TAGS={listen:1,watch:1,pray:1,vote:1,celebrate:1,court:1,recoil:1};
function applyNPCActions(W,tag){ if(!tag) return; var foc=W.focus.tile; var rng=mkRng(900+W.n*7);
  W.actors.forEach(function(a){ if(a.kind!=="citizen"||a.hero||a.merchant) return;
    var poseTag=!!POSE_TAGS[tag]; if(a._directed && !poseTag) return;
    var rr=rng(), pose="idle", stationary=true;
    switch(tag){
      case "rebuild": pose= rr<0.3?"build": rr<0.5?"carry": rr<0.64?"trade":"walk"; stationary=(pose!=="walk"); break;
      case "labor": pose= rr<0.72?"carry":"idle"; break;
      case "court": pose= rr<0.22?"revel": rr<0.4?"watch": rr<0.7?"idle":"walk"; stationary=(pose!=="walk"); if(pose==="watch")faceTo(a,foc); break;
      case "listen": pose= rr<0.82?"watch":"idle"; faceTo(a,foc); break;
      case "recoil": if(rr<0.4){pose="flee";stationary=false;a.sp=0.9+rng()*0.5;} else {pose= rr<0.8?"watch":"idle"; faceTo(a,foc);} break;
      case "panic": pose="flee"; stationary=false; a.sp=1.0+rng()*0.7; break;
      case "pray": pose="pray"; faceTo(a,foc); break;
      case "vote": pose= rr<0.7?"vote":"watch"; faceTo(a,foc); break;
      case "celebrate": pose= rr<0.34?"revel": rr<0.58?"watch": rr<0.8?"vote":"walk"; stationary=(pose!=="walk"); if(pose!=="walk")faceTo(a,foc); break;
      case "watch": default: pose="watch"; faceTo(a,foc); break;
    }
    a.pose=pose; a.idle=stationary; if(stationary && !a.gather){ a.tc=a.c; a.tr=a.r; } }); }

function pickTarget(a){ var W=a.g;
  if(a.gather){ a.tc=clamp(Math.round(a.gather[0]+(a.rng()*7-3.5)),1,W.n-2); a.tr=clamp(Math.round(a.gather[1]+(a.rng()*7-3.5)),1,W.n-2); if(!tileOpen(W,a.tc,a.tr)){a.tc=a.c;a.tr=a.r;} return; }
  if(W.walk.length){ var p=W.walk[Math.floor(a.rng()*W.walk.length)]; a.tc=p[0]+0.5; a.tr=p[1]+0.5; } }
function updateActors(dt){ var W=world;
  for(var i=0;i<W.actors.length;i++){ var a=W.actors[i];
    if(a.fixed || a.idle || a.pose==="fallen" || a.pose==="kneel"){ a.phase+= dt*0.002; continue; }
    if(a.wait>0){ a.wait-=dt; a.phase+=dt*0.001; continue; }
    var dc=a.tc-a.c, dr=a.tr-a.r; var dist=Math.hypot(dc,dr);
    if(dist<0.08){ if(a.hero && a.pose==="walk"){ a.wait=600; } else { a.wait=400+a.rng()*2200; } pickTarget(a); continue; }
    var step=a.sp*dt/1000; if(step>dist) step=dist; a.c+=dc/dist*step; a.r+=dr/dist*step;
    a.face=((dc-dr)<0)?-1:1; a.phase+=dt*0.012*(0.6+a.sp); } }
function buildWalkList(W){ W.walk=[]; var blocked=[]; for(var r=0;r<W.n;r++){blocked[r]=[];}
  W.ents.forEach(function(e){ if(["tree","rock","house","temple","tower","wall","stall","well","tent","fire"].indexOf(e.type)>=0){ for(var i=0;i<(e.w||1);i++)for(var j=0;j<(e.d||1);j++){ var cc=e.c+i,rr=e.r+j; if(blocked[rr]) blocked[rr][cc]=true; } } });
  for(var r2=0;r2<W.n;r2++)for(var c2=0;c2<W.n;c2++){ if(tileOpen(W,c2,r2) && !(blocked[r2]&&blocked[r2][c2])) W.walk.push([c2,r2]); } }

var TOWN=[
/*0 Zeniff rebuilds*/ {start:{text:"Welcome, stranger, to Lehi-Nephi! King Zeniff led us back to the land of our fathers, and we are making it a city once more.",opts:[{label:"Was this land not held by Lamanites?",to:"a"},{label:"How fares the colony?",to:"b"},{label:"Good day.",to:"end"}]},a:{text:"King Laman granted us Lehi-Nephi and Shilom. My father says it was a snare to bring us into bondage, yet for now we prosper and are glad.",opts:[{label:"How fares the colony?",to:"b"},{label:"Farewell.",to:"end"}]},b:{text:"We till the ground for corn and grain, we keep flocks, and we spin flax into cloth. The Lord has dealt kindly with us.",opts:[{label:"Long may it last.",to:"end"}]}},
/*1 Noah reigns*/ {start:{text:"Behold King Noah's tower and the seats of his fine palace! He has built grandly, and the wine of his vineyards never runs dry.",opts:[{label:"Who pays for such splendor?",to:"a"},{label:"And his priests?",to:"b"},{label:"Splendid indeed.",to:"end"}]},a:{text:"We do, a fifth part of all we own. Some grumble, but the king bids us eat, drink, and be merry, for tomorrow we may die.",opts:[{label:"And his priests?",to:"b"},{label:"As you say.",to:"end"}]},b:{text:"Noah cast out the old priests and set up his own, proud men who idle their days in costly apparel. But hush; such talk is perilous.",opts:[{label:"I will say no more.",to:"end"}]}},
/*2 Abinadi warning*/ {start:{text:"That man yonder is Abinadi. He came among us crying that unless we repent, the Lord will bring us into bondage and smite us.",opts:[{label:"Do you believe him?",to:"a"},{label:"What will the king do?",to:"b"},{label:"I will go and listen.",to:"end"}]},a:{text:"He says hard things, yet my heart trembles, for he speaks as one sent of God. I dare not say so where the guards might hear.",opts:[{label:"What will the king do?",to:"b"},{label:"Farewell.",to:"end"}]},b:{text:"Noah is wroth and has sworn to slay him. Two years past Abinadi fled for his life; now he has returned in disguise to warn us again.",opts:[{label:"A brave man.",to:"end"}]}},
/*3 Abinadi testifies*/ {start:{text:"They have bound the prophet before the king and his priests. Still he will not recall his words; he testifies of a Redeemer who shall come.",opts:[{label:"What does he teach?",to:"a"},{label:"How does the king answer?",to:"b"},{label:"Let me hear him.",to:"end"}]},a:{text:"That God Himself shall come down, suffer, and redeem His people, and that salvation comes only through Christ the Lord. The priests cannot trap him in his words.",opts:[{label:"How does the king answer?",to:"b"},{label:"Farewell.",to:"end"}]},b:{text:"Noah was minded to free him at first, fearing his words, but the priests stir him to wrath. I fear it will end in fire.",opts:[{label:"God help him.",to:"end"}]}},
/*4 Martyr; Alma*/ {start:{text:"It is done. They have burned the prophet alive. I cannot stop trembling. He died prophesying the king would suffer that same death by fire.",opts:[{label:"Did none believe him?",to:"a"},{label:"What of his prophecy?",to:"b"},{label:"A dark day.",to:"end"}]},a:{text:"One did, a young priest named Alma. He pleaded for Abinadi's life, and Noah cast him out and sent men to kill him. They say he escaped into the wilderness.",opts:[{label:"What of his prophecy?",to:"b"},{label:"Farewell.",to:"end"}]},b:{text:"Abinadi sealed his testimony with his blood, and his words will surely come to pass. May the Lord have mercy on this people.",opts:[{label:"Amen.",to:"end"}]}},
/*5 Waters of Mormon*/ {start:{text:"Speak softly, friend. We gather here at the waters of Mormon, in the thicket, away from the king's spies. Alma teaches us the words of Abinadi.",opts:[{label:"What happens at these waters?",to:"a"},{label:"What have you promised?",to:"b"},{label:"Peace be with you.",to:"end"}]},a:{text:"Alma baptizes all who believe, already some four hundred and fifty souls. We are born of God and called His church.",opts:[{label:"What have you promised?",to:"b"},{label:"Farewell.",to:"end"}]},b:{text:"To bear one another's burdens, to mourn with those that mourn, to comfort those in need, and to stand as witnesses of God always.",opts:[{label:"A holy covenant.",to:"end"}]}},
/*6 Fall of Noah*/ {start:{text:"The Lamanites are within the walls! Run! In our flight the king commanded us to leave even our wives and children behind!",opts:[{label:"You would abandon their families?",to:"a"},{label:"Where is the king now?",to:"b"},{label:"I must flee!",to:"end"}]},a:{text:"What else, when the spears are at our backs? Yet it is a wicked thing, and the men are turning against Noah for commanding it.",opts:[{label:"Where is the king now?",to:"b"},{label:"Run!",to:"end"}]},b:{text:"Fled with us, but his own men lay hold on him. I think his end has come, just as Abinadi foretold. The daughters who stayed went out and pleaded, and were spared.",opts:[{label:"God have mercy.",to:"end"}]}},
/*7 Priests and daughters*/ {start:{text:"Trouble upon trouble! Noah's old priests, hiding in the wilderness, have carried off some daughters of the Lamanites. Now the Lamanites blame us!",opts:[{label:"Will there be war?",to:"a"},{label:"Who rules you now?",to:"b"},{label:"Heaven help us.",to:"end"}]},a:{text:"They came against us in their fury, but our people went out and pleaded, and the Lamanite king saw it was not our doing. We are spared, for now.",opts:[{label:"Who rules you now?",to:"b"},{label:"Farewell.",to:"end"}]},b:{text:"Limhi, son of Noah, a gentler man than his father. But we are a people brought low, bound under the Lamanite yoke.",opts:[{label:"May better days come.",to:"end"}]}},
/*8 Helam founded*/ {start:{text:"Welcome to Helam! Eight days we journeyed into the wilderness, and here Alma's people have built a city and planted our fields in peace.",opts:[{label:"Why did you leave Nephi?",to:"a"},{label:"Is it truly safe here?",to:"b"},{label:"A fair place.",to:"end"}]},a:{text:"The king's army hunted us for believing Abinadi. The Lord warned Alma to flee, so we gathered our flocks and grain and departed by night.",opts:[{label:"Is it truly safe here?",to:"b"},{label:"Farewell.",to:"end"}]},b:{text:"For now we dwell in gladness, keeping the commandments and serving one another. Alma tends us like a shepherd. We could not be more content.",opts:[{label:"Long may it last.",to:"end"}]}},
/*9 Bondage*/ {start:{text:"Mind your tongue near the guards. We are Limhi's people, and we deliver up half of all we have, our grain and our flocks, to the Lamanites.",opts:[{label:"How did you fall so low?",to:"a"},{label:"Have you not resisted?",to:"b"},{label:"Stay strong.",to:"end"}]},a:{text:"The sins of king Noah brought it upon us. After his fall the Lamanites suffered us to keep the land, but laid this heavy tribute on our backs.",opts:[{label:"Have you not resisted?",to:"b"},{label:"Farewell.",to:"end"}]},b:{text:"Three times we went up to battle, and three times we were beaten, and many widows were left to mourn. Now we humble ourselves and cry to the Lord.",opts:[{label:"May He hear you.",to:"end"}]}},
/*10 Benjamin covenant*/ {start:{text:"We are gathered from all the land, our tents pitched toward the temple, to hear good king Benjamin speak from his tower before he dies.",opts:[{label:"What manner of king is he?",to:"a"},{label:"What does he teach?",to:"b"},{label:"Let me listen.",to:"end"}]},a:{text:"A king who labored with his own hands that we be not burdened with taxes, and who teaches that to serve one another is to serve our God. We love him dearly.",opts:[{label:"What does he teach?",to:"b"},{label:"Farewell.",to:"end"}]},b:{text:"That an angel told him of Christ who shall come, and he gives us a new name, the children of Christ. The Spirit has wrought a mighty change in our hearts.",opts:[{label:"Blessed be his name.",to:"end"}]}},
/*11 Amulon*/ {start:{text:"(barely a whisper) The taskmaster Amulon is watching. We are forbidden to pray aloud on pain of death, so we pour out our hearts in silence.",opts:[{label:"Who is this Amulon?",to:"a"},{label:"How do you bear it?",to:"b"},{label:"I will keep silent too.",to:"end"}]},a:{text:"One of Noah's old priests. The Lamanites set him to rule over us, a cruel jest, that the wicked we fled now hold the whip above our heads.",opts:[{label:"How do you bear it?",to:"b"},{label:"Farewell.",to:"end"}]},b:{text:"The Lord told us He would ease our burdens, and so He has, till we scarcely feel them. We bear them with patience, and even with good cheer.",opts:[{label:"A quiet miracle.",to:"end"}]}},
/*12 Ammon finds Limhi*/ {start:{text:"Have you heard? Strangers have come down from the north, from Zarahemla! Their leader is named Ammon. After all these years, we are found!",opts:[{label:"What does this mean for you?",to:"a"},{label:"Who sent them?",to:"b"},{label:"Wonderful news!",to:"end"}]},a:{text:"Limhi gathered us and bade us be of good comfort, that there is hope of deliverance from bondage at last. We will trust in God and make ready.",opts:[{label:"Who sent them?",to:"b"},{label:"Farewell.",to:"end"}]},b:{text:"King Mosiah of Zarahemla, who never knew what became of our fathers when they went up to this land. Now Ammon will help us find the way home.",opts:[{label:"God be thanked.",to:"end"}]}},
/*13 Escape Limhi*/ {start:{text:"(low voice) Tonight is the night. We have sent extra wine to the Lamanite guards, and they are deep in drink. Ready your flocks and say nothing.",opts:[{label:"How will you get past them?",to:"a"},{label:"Where will you go?",to:"b"},{label:"Go in peace.",to:"end"}]},a:{text:"Out the back way while they slumber, our cattle driven before us. If the Lord favors us, we will be long gone before the morning watch.",opts:[{label:"Where will you go?",to:"b"},{label:"Farewell.",to:"end"}]},b:{text:"Down through the wilderness to Zarahemla, the land of our kinsmen, where king Mosiah will receive us. We have prayed for this night for years.",opts:[{label:"God speed you home.",to:"end"}]}},
/*14 Escape Alma*/ {start:{text:"Quietly, friend. A deep sleep from the Lord has fallen upon Amulon's guards. Alma bids us gather our flocks and our grain and steal away from Helam.",opts:[{label:"Will you truly escape?",to:"a"},{label:"Where will you go?",to:"b"},{label:"Go in peace.",to:"end"}]},a:{text:"The Lord promised to deliver us, and He has stopped the very eyes of our guards with slumber. We go out trusting wholly in Him.",opts:[{label:"Where will you go?",to:"b"},{label:"Farewell.",to:"end"}]},b:{text:"To Zarahemla, to join king Mosiah and the rest of the Lord's people. Twelve days through the wilderness, but the Lord will lead us.",opts:[{label:"God be with you.",to:"end"}]}},
/*15 Gathering*/ {start:{text:"What a day of rejoicing! Every people is gathered as one in Zarahemla, Limhi's people, Alma's people, and the people of Mosiah. We are scattered no more!",opts:[{label:"How did all this come to pass?",to:"a"},{label:"What does the king do now?",to:"b"},{label:"I rejoice with you!",to:"end"}]},a:{text:"The Lord brought every one of us out, some from bondage, some from the wilderness, and led us here. The records of our journeys were read aloud, and the people wept for joy.",opts:[{label:"What does the king do now?",to:"b"},{label:"Farewell.",to:"end"}]},b:{text:"Mosiah has given Alma authority to establish churches through all the land, that the word of God may be taught to every soul. The Lord has remembered us.",opts:[{label:"Praise be to God.",to:"end"}]}},
/*16 Unbelief*/ {start:{text:"These are troubled times for the church. A whole generation has grown up that will not believe the words of their fathers, nor be baptized.",opts:[{label:"What is the trouble exactly?",to:"a"},{label:"What will Alma do?",to:"b"},{label:"A hard thing.",to:"end"}]},a:{text:"The unbelievers lead many astray with flattering words, and there are sins now even among the church. Alma knows not how he ought to judge them.",opts:[{label:"What will Alma do?",to:"b"},{label:"Farewell.",to:"end"}]},b:{text:"He has gone to inquire of the Lord. They say the Lord answered: whoso repents shall be forgiven, but the unrepentant are not to be numbered among His people.",opts:[{label:"Wise counsel.",to:"end"}]}},
/*17 Angel*/ {start:{text:"Did you see it? An angel of the Lord came down in a cloud, and his voice shook the earth! Alma the younger and the sons of Mosiah lie yonder as though dead.",opts:[{label:"Who is Alma the younger?",to:"a"},{label:"What did the angel say?",to:"b"},{label:"A fearful wonder.",to:"end"}]},a:{text:"The high priest's own son, a wicked man who went about in secret destroying the church and leading many into sin. None of us thought him reachable.",opts:[{label:"What did the angel say?",to:"b"},{label:"Farewell.",to:"end"}]},b:{text:"He rebuked Alma for persecuting the church, and said it was the prayers of his father and the faithful that brought him low. Now we wait to see what manner of man shall rise.",opts:[{label:"God is merciful.",to:"end"}]}},
/*18 Records*/ {start:{text:"King Mosiah has been translating an ancient record, twenty-four plates of pure gold, found long ago by Limhi's search party in a land covered with bones.",opts:[{label:"Whose record is it?",to:"a"},{label:"How can he read it?",to:"b"},{label:"A solemn work.",to:"end"}]},a:{text:"A people called the Jaredites, who came from the great tower when the Lord confounded the languages. They grew mighty, then destroyed themselves utterly in war.",opts:[{label:"How can he read it?",to:"b"},{label:"Farewell.",to:"end"}]},b:{text:"By two seer stones, the interpreters, handed down for this very purpose. By the gift and power of God the king makes their tongue plain to us.",opts:[{label:"Marvelous.",to:"end"}]}},
/*19 Judges*/ {start:{text:"A new thing today, friend! King Mosiah's sons would not take the throne, so he proposes we be governed by judges, chosen by the voice of the people.",opts:[{label:"Is it wise to have no king?",to:"a"},{label:"How will judges be chosen?",to:"b"},{label:"Momentous times.",to:"end"}]},a:{text:"Mosiah says a righteous king does much good, but a wicked one works great iniquity and is hard to dethrone. Better the burden of judgment be shared by all.",opts:[{label:"How will judges be chosen?",to:"b"},{label:"Farewell.",to:"end"}]},b:{text:"By the voice of the people, and judged in turn by higher judges if they stray. Alma the younger is to be our first chief judge. So ends the reign of the kings.",opts:[{label:"May it prosper.",to:"end"}]}}
];
function townSay(sc){ return TOWN[sc] || {start:{text:"Peace be unto you, traveler.",opts:[{label:"And unto you.",to:"end"}]}}; }
/* --- hero lines, varying by scene where a hero recurs --- */
var NOAH_REIGN={start:{text:"I am Noah, king over this land. Look upon my works, my palace, my tower, my vineyards. Is it not a glorious reign?",opts:[{label:"Your taxes burden the people.",to:"t"},{label:"And your priests?",to:"p"},{label:"A glorious reign, O king.",to:"end"}]},t:{text:"A fifth part is a trifle for the splendor they enjoy through me. Let them eat and drink and be glad. I will hear no complaints.",opts:[{label:"As you say.",to:"end"}]},p:{text:"I put away the doddering old priests and chose men after my own heart. They feast at my side and tell me what a fine king I am.",opts:[{label:"I see.",to:"end"}]}};
var NOAH_TRIAL={start:{text:"This Abinadi vexes me with prophecies of doom. Who is he to say my reign shall end in bondage and fire?",opts:[{label:"Perhaps he speaks truly.",to:"t"},{label:"Will you free him?",to:"f"},{label:"Forgive me, O king.",to:"end"}]},t:{text:"Hold your tongue! ...And yet his words trouble me. No, my priests counsel me to be strong. I will not be cowed by a wandering madman.",opts:[{label:"I withdraw.",to:"end"}]},f:{text:"I was minded to, but he reviled me to my face and would not recall his words. Unless he takes them back, he shall surely die.",opts:[{label:"God help him.",to:"end"}]}};
var NOAH_FALL={start:{text:"The Lamanites are upon us! Flee with me, leave the women, leave the children, only run!",opts:[{label:"You would abandon their families?",to:"a"},{label:"Abinadi foretold this.",to:"b"},{label:"I must run!",to:"end"}]},a:{text:"Would you have us all perish? ...The men murmur against me even now. I begin to fear I have led them only to ruin.",opts:[{label:"Abinadi foretold this.",to:"b"},{label:"Farewell.",to:"end"}]},b:{text:"Do not speak that name to me! ...His word follows me like a shadow. Is there no escape from a dead man's prophecy?",opts:[{label:"There is none.",to:"end"}]}};
var ABINADI_WARN={start:{text:"Thus saith the Lord: except this people repent, I will visit them in mine anger, and they shall be brought into bondage and smitten on the cheek.",opts:[{label:"Do you not fear the king?",to:"f"},{label:"What must we do?",to:"d"},{label:"Farewell.",to:"end"}]},f:{text:"I have done as the Lord commanded. Once I fled from Noah; now I return in disguise to deliver His message. Let them do with me what they will.",opts:[{label:"What must we do?",to:"d"},{label:"Farewell.",to:"end"}]},d:{text:"Repent, and turn unto the Lord. Remember His commandments, and look to the Redeemer who shall come to break the bands of death.",opts:[{label:"I will remember.",to:"end"}]}};
var ABINADI_TRIAL={start:{text:"They have bound me before the king, yet I will not recall my words, for they are true. God Himself shall come down to redeem His people.",opts:[{label:"They will surely kill you.",to:"k"},{label:"Tell me of this Redeemer.",to:"r"},{label:"Be strong.",to:"end"}]},k:{text:"If ye slay me, ye will shed innocent blood, and this shall stand as a witness against you at the last day. I cannot deny what God has shown me.",opts:[{label:"Tell me of this Redeemer.",to:"r"},{label:"Farewell.",to:"end"}]},r:{text:"He shall be called the Son of God, and shall suffer death for us, and break the bands of death to bring the resurrection. Salvation is in Him alone.",opts:[{label:"I believe you.",to:"end"}]}};
var ALMA_FLEE={start:{text:"Abinadi's words burn in my heart. I pleaded for his life, and the king cast me out and sent men to slay me. I must hide and write down all the prophet taught.",opts:[{label:"You believed him, then?",to:"b"},{label:"Where will you go?",to:"w"},{label:"Go safely.",to:"end"}]},b:{text:"Every word. He testified of Christ and of redemption, and I knew it was the truth. I cannot serve in Noah's court a day longer.",opts:[{label:"Where will you go?",to:"w"},{label:"Farewell.",to:"end"}]},w:{text:"To a place I know, a thicket of trees beside a fountain of pure water, the place of Mormon. There I will teach all who come to hear.",opts:[{label:"The Lord be with you.",to:"end"}]}};
var ALMA_WATERS={start:{text:"Welcome, if you come in faith. Here at the waters of Mormon I teach the words of Abinadi, and baptize all who desire to come into the fold of God.",opts:[{label:"How many have come?",to:"n"},{label:"What do they covenant?",to:"c"},{label:"Peace be with you.",to:"end"}]},n:{text:"About four hundred and fifty souls, and we have organized as the church of Christ, with priests to teach. We do it in secret, for Noah's spies are everywhere.",opts:[{label:"What do they covenant?",to:"c"},{label:"Farewell.",to:"end"}]},c:{text:"To bear one another's burdens, to mourn with those that mourn, and to stand as witnesses of God at all times and in all places. So are they baptized.",opts:[{label:"A holy covenant.",to:"end"}]}};
var ALMA_HELAM={start:{text:"The Lord warned me Noah's armies were coming, so we fled eight days into the wilderness, and here we have built Helam. It is a good land.",opts:[{label:"How do your people fare?",to:"f"},{label:"Do you not fear discovery?",to:"d"},{label:"Peace be with you.",to:"end"}]},f:{text:"They prosper and keep the commandments, and I have taught them never to trust in any king, but in God alone. We serve one another in gladness.",opts:[{label:"Do you not fear discovery?",to:"d"},{label:"Farewell.",to:"end"}]},d:{text:"I trust the Lord to keep us. Yet I confess a watchfulness, for the wilderness hides many wanderers, and not all of them are friends.",opts:[{label:"May He guard you.",to:"end"}]}};
var LIMHI_BONDAGE={start:{text:"I am Limhi, son of Noah. I rule a people in bondage, and my father's sins lie heavy on us all. We give half of all we have to the Lamanites.",opts:[{label:"Could you not throw off the yoke?",to:"y"},{label:"What hope remains?",to:"h"},{label:"I grieve for your people.",to:"end"}]},y:{text:"We tried, three times we went to battle, and three times were driven back with great slaughter. Now I would have my people humble themselves and trust in God.",opts:[{label:"What hope remains?",to:"h"},{label:"Farewell.",to:"end"}]},h:{text:"I know not, save that the Lord is slow to anger toward the penitent. We cry to Him daily. Surely He will not forget a people who turn to Him.",opts:[{label:"May He deliver you.",to:"end"}]}};
var LIMHI_HOPE={start:{text:"Ammon and his brethren have come from Zarahemla! For the first time in long years I have hope of leading my people out of bondage.",opts:[{label:"How will you escape?",to:"e"},{label:"What did you learn from Ammon?",to:"a"},{label:"God be with you.",to:"end"}]},e:{text:"We will lay a plan. If the Lord softens the way, we will gather our flocks and slip past the guards by night, down to the land of Zarahemla.",opts:[{label:"What did you learn from Ammon?",to:"a"},{label:"Farewell.",to:"end"}]},a:{text:"That our kinsmen still live, and a prophet-king, Mosiah, reigns there in peace. I have shown Ammon the gold plates our search party found, a record we cannot read.",opts:[{label:"May you reach home.",to:"end"}]}};
var BENJAMIN={start:{text:"I have gathered you to give this people a name, and to teach you that when ye are in the service of your fellow beings, ye are only in the service of your God.",opts:[{label:"What name do you give us?",to:"n"},{label:"Teach me, O king.",to:"t"},{label:"Thank you, King Benjamin.",to:"end"}]},n:{text:"Ye shall be called the children of Christ, for this day He hath spiritually begotten you. Take His name upon you.",opts:[{label:"Teach me more.",to:"t"},{label:"Farewell.",to:"end"}]},t:{text:"Believe in God; believe that ye must repent and humble yourselves. Then shall ye always rejoice, and be filled with His love.",opts:[{label:"I will remember.",to:"end"}]}};
var AMULON={start:{text:"I am Amulon. King Laman has set me over this land. Labor, pay your tribute, and pray not to your God, on pain of death.",opts:[{label:"Why forbid our prayers?",to:"p"},{label:"We will bear it.",to:"b"},{label:"Say no more.",to:"end"}]},p:{text:"Because I will not have it. Yet I see your burdens made light and your faces undismayed. Strange is this God of yours.",opts:[{label:"He strengthens us.",to:"end"}]},b:{text:"See that you do. Your God may ease your loads, but I will not ease my watch.",opts:[{label:"Understood.",to:"end"}]}};
var AMMON={start:{text:"I am Ammon, a descendant of Zarahemla. With sixteen strong men I searched out this land, and found you, the people of Limhi.",opts:[{label:"Can you lead us to Zarahemla?",to:"l"},{label:"What news from the north?",to:"n"},{label:"Well met.",to:"end"}]},l:{text:"If your king will gather his people, we shall go down to Zarahemla together, where Mosiah reigns and you may dwell in safety.",opts:[{label:"God be thanked.",to:"end"}]},n:{text:"King Mosiah has long wondered your fate, for it was your fathers who went up from Zarahemla and were never heard from again.",opts:[{label:"Now you have found us.",to:"end"}]}};
var MOSIAH_GATHER={start:{text:"I am Mosiah, son of Benjamin. This day I have gathered all the people into one, those of Limhi, those of Alma, and my own. The Lord has been gracious.",opts:[{label:"What of the people brought in?",to:"p"},{label:"What now for the church?",to:"c"},{label:"Blessings, O king.",to:"end"}]},p:{text:"I had the records of their journeys read to all the people, that they might know the goodness of God in their deliverance. There was much weeping and much joy.",opts:[{label:"What now for the church?",to:"c"},{label:"Farewell.",to:"end"}]},c:{text:"I have given Alma authority to establish churches throughout the land, and to ordain priests and teachers, that the word of God reach every soul.",opts:[{label:"Wisely done.",to:"end"}]}};
var MOSIAH_UNBELIEF={start:{text:"My heart is heavy. A rising generation will not believe the words of their fathers, and there are dissensions and sins within the church.",opts:[{label:"How will the church be governed?",to:"g"},{label:"Can such people be reclaimed?",to:"r"},{label:"Be strengthened, O king.",to:"end"}]},g:{text:"That burden I have laid upon Alma, who presides over the church. He has inquired of the Lord how he ought to judge those who transgress.",opts:[{label:"Can such people be reclaimed?",to:"r"},{label:"Farewell.",to:"end"}]},r:{text:"The Lord is merciful: as often as they repent and seek forgiveness with real intent, they shall be forgiven. But the unrepentant He will not own.",opts:[{label:"A just answer.",to:"end"}]}};
var MOSIAH_RECORDS={start:{text:"I am Mosiah. By the gift and power of God I have translated the twenty-four gold plates found in the north, the record of a fallen people.",opts:[{label:"Who were these people?",to:"w"},{label:"How were the plates found?",to:"f"},{label:"A solemn work, O king.",to:"end"}]},w:{text:"The Jaredites, who came from the great tower of old, when the Lord confounded the language of the people. They became mighty, then destroyed one another in their wickedness.",opts:[{label:"How were the plates found?",to:"f"},{label:"Farewell.",to:"end"}]},f:{text:"Limhi's men, seeking Zarahemla, came upon a land of bones and ruins and bore back these plates. I read them by the interpreters handed down to me.",opts:[{label:"A warning to us all.",to:"end"}]}};
var MOSIAH_JUDGES={start:{text:"I am Mosiah. My sons will not reign after me, so I would give this people their liberty, to be governed not by a king but by judges of their own choosing.",opts:[{label:"Why turn away from kings?",to:"k"},{label:"How shall it be ordered?",to:"o"},{label:"Wise counsel, O king.",to:"end"}]},k:{text:"A righteous king does much good, but a wicked one leads a whole nation into sin, and can scarce be removed save by bloodshed. Let the burden be borne by the voice of the people.",opts:[{label:"How shall it be ordered?",to:"o"},{label:"Farewell.",to:"end"}]},o:{text:"Judges chosen by the people, and answerable to higher judges if they pervert the law, so that no one man holds the whole power. So ends the reign of the kings.",opts:[{label:"May it prosper.",to:"end"}]}};
var ANGEL={start:{text:"Alma, arise! Why persecutest thou the church of God? The Lord hath heard the prayers of His people, and of thy father.",opts:[{label:"Who are you?",to:"w"},{label:"I tremble before you.",to:"end"}]},w:{text:"I am sent to convince thee of the power of God. Go thy way, and seek to destroy the church no more.",opts:[{label:"I will repent.",to:"end"}]}};
var PRIESTS={start:{text:"We are the priests of Noah, fled into the wilderness. We dare not return, for the people would surely slay us.",opts:[{label:"You seized the Lamanite daughters!",to:"d"},{label:"What will you do now?",to:"x"},{label:"Leave me be.",to:"end"}]},d:{text:"We were desperate men. It nearly brought war upon Limhi's people. We have much to answer for.",opts:[{label:"Indeed you do.",to:"end"}]},x:{text:"We will join with Amulon and seek favor among the Lamanites. It is the only road left to us.",opts:[{label:"A dark road.",to:"end"}]}};
var SHEEP={start:{text:"Baaa.",opts:[{label:"Hello there, little one.",to:"a"},{label:"Are you one of the Good Shepherd's flock?",to:"b"},{label:"(Pet the sheep)",to:"c"},{label:"Carry on, friend.",to:"end"}]},
  a:{text:"Baaa. (It blinks at you, unbothered, and goes on chewing.)",opts:[{label:"Are you lost from your fold?",to:"d"},{label:"(Pet the sheep)",to:"c"},{label:"Farewell.",to:"end"}]},

function heroSay(name,sc){ switch(name){
  case "King Noah": return sc===6?NOAH_FALL:((sc===2||sc===3)?NOAH_TRIAL:NOAH_REIGN);
  case "Abinadi": return sc===3?ABINADI_TRIAL:ABINADI_WARN;
  case "Alma": return sc===5?ALMA_WATERS:(sc===8?ALMA_HELAM:ALMA_FLEE);
  case "King Limhi": return sc===12?LIMHI_HOPE:LIMHI_BONDAGE;
  case "King Benjamin": return BENJAMIN;
  case "Amulon": return AMULON;
  case "Ammon": return AMMON;
  case "King Mosiah": return sc===15?MOSIAH_GATHER:(sc===18?MOSIAH_RECORDS:(sc===19?MOSIAH_JUDGES:MOSIAH_UNBELIEF));
  case "An Angel of the Lord": return ANGEL;
  case "Noah's Priests": return PRIESTS;
  case "The Faithful": return sc===14?FAITHFUL_ALMA:FAITHFUL_LIMHI;
} return null; }
function drawMinimap(){ var W=world, S=Math.min(116, Wc*0.30), pad=12, x0=Wc-S-pad, y0=pad; ctx.save();
  ctx.fillStyle="rgba(14,16,24,0.62)"; roundRect(x0-4,y0-4,S+8,S+8,9); ctx.fill(); ctx.strokeStyle="rgba(201,162,39,0.5)"; ctx.lineWidth=1; ctx.stroke();
  roundRect(x0,y0,S,S,6); ctx.clip(); ctx.fillStyle="rgba(58,64,52,0.55)"; ctx.fillRect(x0,y0,S,S); var sc=S/W.n; function mx(c){return x0+c*sc;} function my(r){return y0+r*sc;}
  for(var r=0;r<W.n;r++)for(var c=0;c<W.n;c++){ var t=W.grid[r][c], col=null; if(t==="water")col="rgba(90,140,150,0.6)"; else if(t==="road"||t==="plaza")col="rgba(150,130,90,0.4)"; else if(t==="field")col="rgba(120,110,60,0.4)"; if(col){ctx.fillStyle=col;ctx.fillRect(mx(c),my(r),sc+0.6,sc+0.6);} }
  W.ents.forEach(function(e){ var col=null; if(e.type==="house")col="rgba(120,96,60,0.95)"; else if(e.type==="wall")col="rgba(92,82,68,0.95)"; else if(e.type==="temple")col="rgba(200,170,90,0.95)"; else if(e.type==="tower")col="#e7c64a"; else if(e.type==="gate")col="rgba(170,120,60,1)"; if(col){ctx.fillStyle=col;ctx.fillRect(mx(e.c),my(e.r),Math.max(1.6,(e.w||1)*sc),Math.max(1.6,(e.d||1)*sc));} });
  ctx.fillStyle="rgba(240,236,220,0.65)"; world.actors.forEach(function(a){ if(a.hero||a.merchant) return; var ap=actorPos(a); ctx.fillRect(mx(ap[0])-0.6,my(ap[1])-0.6,1.7,1.7); });
  ctx.fillStyle="#f0c843"; world.actors.forEach(function(a){ if(!(a.hero||a.merchant)) return; var ap=actorPos(a); ctx.beginPath(); ctx.arc(mx(ap[0]),my(ap[1]),2.1,0,6.28); ctx.fill(); });
  var pxm=mx(WALK.player.x), pym=my(WALK.player.y), fx=Math.cos(WALK.yaw),fy=Math.sin(WALK.yaw);
  ctx.fillStyle="#7fd0ff"; ctx.beginPath(); ctx.moveTo(pxm+fx*5.5,pym+fy*5.5); ctx.lineTo(pxm-fy*3.6-fx*2.4,pym+fx*3.6-fy*2.4); ctx.lineTo(pxm+fy*3.6-fx*2.4,pym-fx*3.6-fy*2.4); ctx.closePath(); ctx.fill();
  ctx.strokeStyle="rgba(0,0,0,0.5)"; ctx.lineWidth=0.8; ctx.stroke(); ctx.restore(); }

/* ===================== RENDER LOOP ===================== */
function renderIso(t){
  if(cam.anim){ var k=Math.min(1,(t-cam.t0)/650); var e=1-Math.pow(1-k,3); cam.x=lerp(cam.sx,cam.tx,e); cam.y=lerp(cam.sy,cam.ty,e); cam.zoom=lerp(cam.sz,cam.tz,e); if(k>=1) cam.anim=false; }
  ctx.setTransform(DPR,0,0,DPR,0,0); drawBackdrop();
  ctx.save(); ctx.translate(cam.x,cam.y); ctx.scale(cam.zoom,cam.zoom);
  for(var sgn=0;sgn<world.n*2;sgn++){ for(var r=0;r<world.n;r++){ var c=sgn-r; if(c<0||c>=world.n) continue; drawTile(c,r, world.grid[r][c]); } }
  var list=[], heroes=[]; world.ents.forEach(function(e){ var depth=(e.c+(e.w||1))+(e.r+(e.d||1)); if(e.type==="tree") depth=(e.c+0.7)+(e.r+0.7); list.push({d:depth,e:e}); });
  world.actors.forEach(function(a){ if(a.hero){ heroes.push(a); } else { list.push({d:(a.c+a.r),a:a}); } });
  list.sort(function(p,q){ return p.d-q.d; });
  for(var i=0;i<list.length;i++){ if(list[i].e) drawEntity(list[i].e); else drawPerson(list[i].a); }
  ctx.restore();
  drawWorldTint(); drawFocusDim();
  ctx.save(); ctx.translate(cam.x,cam.y); ctx.scale(cam.zoom,cam.zoom);
  heroes.sort(function(p,q){ return (p.fixed?-1:(p.c+p.r)) - (q.fixed?-1:(q.c+q.r)); });
  for(var h=0;h<heroes.length;h++){ drawPerson(heroes[h]); }
  ctx.restore();
  drawBeam(); drawWeather(); drawVignette(); drawHeroLabels(); }
var lastT=now();
function frame(t){ var dt=Math.min(t-lastT,50); lastT=t;
  updateActors(dt);
  if(WALK.active){ updateWalk(dt); renderWalk(); }
  else { renderIso(t); }
  requestAnimationFrame(frame); }

var NPCACTION=["rebuild","court","listen","listen","recoil","pray","panic","panic","rebuild","labor","listen","pray","labor","","","celebrate","listen","watch","watch","vote"];
function buildPlace(place, mods){ var W;
  if(place==="nephi") W=genCity("nephi",{seed:11,n:22,walls:true,towerH:84,style:"nephi"});
  else if(place==="zarahemla") W=genCity("zarahemla",{seed:5,n:24,walls:true,towerH:92,style:"zarahemla"});
  else if(place==="mormon") W=genWilderness({seed:21});
  else W=genSettlement({seed:33});
  buildWalkList(W);
  // base citizens (varies by place)
  var rng=mkRng((place==="zarahemla"?500:300));
  var occ=[]; for(var r=0;r<W.n;r++){occ[r]=[];}
  W.ents.forEach(function(e){ for(var i=0;i<(e.w||1);i++)for(var j=0;j<(e.d||1);j++){ if(occ[e.r+j]) occ[e.r+j][e.c+i]=true; } });
  var basePop = place==="zarahemla"?18 : place==="nephi"?16 : place==="helam"?12 : 0;
  addCitizens(W,occ,basePop,rng,W.focus.tile,0.2);
  world=W; applyMods(W, mods); return W; }

var scene=-1, playing=false, playTimer=null, selectedLm=null;
function buildScrubber(){ var h=""; for(var i=0;i<SCENES.length;i++) h+='<div class="tick" data-i="'+i+'"></div>'; document.getElementById("scrubber").innerHTML=h; }
function updateScrub(){ var ticks=document.querySelectorAll("#scrubber .tick"); for(var i=0;i<ticks.length;i++){ ticks[i].className="tick"+(i<scene?" past":"")+(i===scene?" now":""); } }
function pinSvg(){ return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#c9a227" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>'; }
function renderContent(){ var c=document.getElementById("content");
  if(selectedLm){ c.innerHTML='<div class="lm"><button class="x" id="lmX">&times;</button><div class="k">'+selectedLm.kind+'</div><div class="n">'+selectedLm.name+'</div><div class="i">'+selectedLm.info+'</div></div>';
    document.getElementById("lmX").addEventListener("click",function(){ selectedLm=null; renderContent(); }); }
  else { var S=SCENES[scene]; c.innerHTML='<div class="cap"><span class="pin">'+pinSvg()+'</span><span>'+S.cap+'</span></div>'; } }
function frameTarget(S){ var P, off=0;
  if(S.focus==="hero" && world.primaryHero){ P=heroWorld(world.primaryHero); off=(STAGE.shot==="closeup"? 44 : 18); }
  else if(S.focus==="tower" && world.tower){ P={x:world.tower.anchor.x, y:world.tower.anchor.y}; off=-40; }
  else if(S.focus==="gate" && world.gate){ P=iso(world.gate[0]+0.5,world.gate[1]+0.5); off=10; }
  else if(S.focus==="water" && world._pool){ P=iso(world._pool[0],world._pool[1]); off=6; }
  else if(S.focus==="temple" && world.temple){ P=iso(world.temple[0]+1.5,world.temple[1]+1); off=20; }
  else { var ft=world.focus.tile; P=iso(ft[0],ft[1]); off=24; }
  return {x:P.x, y:P.y-off}; }
function setScene(i,animate){ scene=clamp(i,0,SCENES.length-1); selectedLm=null; var S=SCENES[scene];
  STAGE.mood=MOODS[S.light]||MOODS.day; STAGE.lightning=0;
  STAGE.shot=S.shot||"establish";
  STAGE.dim=(S.dim!=null)? S.dim : (STAGE.shot==="closeup"?0.55: STAGE.shot==="tower"?0.3: 0);
  STAGE.beam=!!S.beam;
  STAGE.heroBoost=(STAGE.shot==="closeup"?1.35: STAGE.shot==="tower"?1.18: 1.05);
  buildPlace(S.place, S.mods);
  applyNPCActions(world, NPCACTION[scene]);
  if(WALK.active) walkSyncScene();
  document.getElementById("sceneTitle").textContent=S.t;
  document.getElementById("sceneMeta").textContent=(scene+1)+" / "+SCENES.length+"  ·  "+S.d;
  var chips=document.querySelectorAll(".chip"); for(var k=0;k<chips.length;k++){ chips[k].classList.toggle("on", chips[k].getAttribute("data-go")===S.place); }
  var tgt=frameTarget(S); focusWorld(tgt.x, tgt.y, S.zoom||1.0, animate);
  updateScrub(); renderContent(); }
function showLandmark(L){ stopPlay(); selectedLm=L; renderContent(); focusWorld(L.ax, L.ay+20, Math.max(cam.zoom,1.3), true); }
function startPlay(){ playing=true; document.getElementById("playIcon").innerHTML='<rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/>'; tick();
  function tick(){ playTimer=setTimeout(function(){ if(scene>=SCENES.length-1){ stopPlay(); return; } setScene(scene+1,true); tick(); }, 4600); } }
function stopPlay(){ playing=false; if(playTimer) clearTimeout(playTimer); document.getElementById("playIcon").innerHTML='<path d="M8 5v14l11-7z"/>'; }
